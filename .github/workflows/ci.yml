name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Runs the full test suite, which includes the migration upgrade/downgrade round-trip
      # (tests/test_migrations.py) -- a broken or irreversible migration fails CI, not production.
      - run: pytest -v
